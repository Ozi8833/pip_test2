<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>WOS 時計同期 PoC v2 (見比べ特化)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; }
    body {
      background: #080c14;
      color: #e6f1ff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: #0f172a;
      border: 1px solid #00f0ff;
      border-radius: 16px;
      padding: 16px;
      width: 100%;
      max-width: 440px;
      margin-bottom: 16px;
      box-shadow: 0 4px 20px rgba(0, 240, 255, 0.15);
    }
    .btn-main {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      font-size: 1.05rem;
      font-weight: 900;
      cursor: pointer;
      background: linear-gradient(135deg, #00f0ff 0%, #0072ff 100%);
      color: #000;
      box-shadow: 0 4px 15px rgba(0, 240, 255, 0.4);
      margin-bottom: 16px;
    }
    .live-clock-disp {
      font-family: monospace;
      font-size: 2.2rem;
      font-weight: 900;
      color: #00f0ff;
      text-align: center;
      background: #000;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #00f0ff;
      margin-bottom: 16px;
      letter-spacing: 0.05em;
    }
    .offset-badge {
      text-align: center;
      font-size: 0.95rem;
      font-weight: bold;
      color: #facc15;
      background: rgba(250, 204, 21, 0.15);
      border: 1px solid rgba(250, 204, 21, 0.4);
      padding: 6px;
      border-radius: 8px;
      margin-bottom: 16px;
    }
    .grid-btns {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }
    .btn-tune {
      padding: 12px 4px;
      border-radius: 8px;
      border: 1px solid #38bdf8;
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      font-weight: 900;
      font-size: 0.95rem;
      cursor: pointer;
    }
    .btn-tune:active {
      background: rgba(56, 189, 248, 0.4);
      transform: scale(0.96);
    }
    .jump-title {
      font-size: 0.85rem;
      color: #94a3b8;
      font-weight: bold;
      margin-bottom: 6px;
    }
    .grid-jumps {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
      margin-bottom: 16px;
    }
    .btn-jump {
      padding: 10px 0;
      border-radius: 6px;
      border: 1px solid #00ff88;
      background: rgba(0, 255, 136, 0.15);
      color: #00ff88;
      font-weight: 900;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .btn-jump:active {
      background: rgba(0, 255, 136, 0.4);
      transform: scale(0.96);
    }
    .btn-reset {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ff3b5c;
      background: rgba(255, 59, 92, 0.15);
      color: #ff3b5c;
      font-weight: bold;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .btn-reset:active { background: rgba(255, 59, 92, 0.3); }
    .guide-box {
      background: rgba(0,0,0,0.6);
      border-left: 4px solid #00f0ff;
      padding: 12px;
      border-radius: 6px;
      font-size: 0.82rem;
      line-height: 1.6;
      color: #cbd5e1;
      margin-top: 12px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2 style="color: #ffb700; font-size: 1.15rem; margin-bottom: 10px; text-align: center;">
      ⏱️ WOS 時計同期 (見比べ特化スリム小窓)
    </h2>

    <!-- アプリ現在時刻 -->
    <div id="ui-live-clock" class="live-clock-disp">00:00:00.0</div>

    <!-- 現在の補正値 -->
    <div id="ui-offset-badge" class="offset-badge">現在の補正値: 0.0s (±0ms)</div>

    <!-- 1. 小窓起動ボタン -->
    <button id="btn-pip-toggle" class="btn-main">📺 縦長スリム小窓 (PiP) を開く</button>

    <!-- 2. 手動微調整ボタン (+-1秒、+-0.1秒) -->
    <div class="grid-btns">
      <button class="btn-tune" onclick="adjustOffset(-1000)">-1.0s</button>
      <button class="btn-tune" onclick="adjustOffset(-100)">-0.1s</button>
      <button class="btn-tune" onclick="adjustOffset(+100)">+0.1s</button>
      <button class="btn-tune" onclick="adjustOffset(+1000)">+1.0s</button>
    </div>

    <!-- 3. 秒数一発ジャンプボタン (:00s〜:50s) -->
    <div class="jump-title">🎯 秒数一発ジャンプ (ホワサバがその秒になった瞬間タップ):</div>
    <div class="grid-jumps">
      <button class="btn-jump" onclick="jumpToSecond(0)">:00s</button>
      <button class="btn-jump" onclick="jumpToSecond(10)">:10s</button>
      <button class="btn-jump" onclick="jumpToSecond(20)">:20s</button>
      <button class="btn-jump" onclick="jumpToSecond(30)">:30s</button>
      <button class="btn-jump" onclick="jumpToSecond(40)">:40s</button>
      <button class="btn-jump" onclick="jumpToSecond(50)">:50s</button>
    </div>

    <!-- 補正リセット -->
    <button class="btn-reset" onclick="resetOffset()">🔄 補正値をリセット (0.0s)</button>

    <!-- ガイド説明 -->
    <div class="guide-box">
      <b>💡 スマホ1台での合わせ方:</b><br>
      ① 上の「📺 縦長スリム小窓」を開いてホワサバへ移動。<br>
      ② 小窓を画面左上に置いても、ホワサバの時計が隠れません！<br>
      ③ ホワサバと小窓を見比べて「ズレ」を目視確認。<br>
      ④ アプリに戻り、上の [+-0.1s] や [:00s] でピッタリ合わせます！
    </div>
  </div>

  <!-- 縦長スリム (3:4 比率: 横200px × 縦267px) Canvas & Video -->
  <canvas id="pip-canvas" width="200" height="267" style="display: none;"></canvas>
  <video id="pip-video" playsinline muted autoplay style="position: fixed; bottom: 0; right: 0; width: 2px; height: 2px; opacity: 0.05; pointer-events: none; z-index: -1;"></video>

  <script>
    const canvas = document.getElementById('pip-canvas');
    const ctx = canvas.getContext('2d');
    const video = document.getElementById('pip-video');
    const btnPip = document.getElementById('btn-pip-toggle');
    const uiLiveClock = document.getElementById('ui-live-clock');
    const uiOffsetBadge = document.getElementById('ui-offset-badge');

    let pipStream = null;
    let pipTrack = null;
    let isPipActive = false;
    let syncOffsetMs = 0;

    function getNow() {
      return new Date(Date.now() + syncOffsetMs);
    }

    function formatFullTime(d) {
      const h = String(d.getUTCHours()).padStart(2, '0');
      const m = String(d.getUTCMinutes()).padStart(2, '0');
      const s = String(d.getUTCSeconds()).padStart(2, '0');
      const f = Math.floor(d.getUTCMilliseconds() / 100);
      return `${h}:${m}:${s}.${f}`;
    }

    function formatMinutesSeconds(d) {
      const m = String(d.getUTCMinutes()).padStart(2, '0');
      const s = String(d.getUTCSeconds()).padStart(2, '0');
      const f = Math.floor(d.getUTCMilliseconds() / 100);
      return `${m}:${s}.${f}`;
    }

    function updateBadge() {
      const sec = (syncOffsetMs / 1000).toFixed(1);
      const sign = syncOffsetMs > 0 ? '+' : '';
      uiOffsetBadge.textContent = `現在の補正値: ${sign}${sec}s (${syncOffsetMs}ms)`;
    }

    // 手動微調整 (+-0.1s, +-1.0s)
    function adjustOffset(deltaMs) {
      syncOffsetMs += deltaMs;
      updateBadge();
      drawHUD();
    }

    // 秒数一発ジャンプ
    function jumpToSecond(targetSec) {
      const rawNow = new Date();
      const currentSecWithMs = rawNow.getUTCSeconds() + (rawNow.getUTCMilliseconds() / 1000);
      let diff = targetSec - currentSecWithMs;
      if (diff > 30) diff -= 60;
      if (diff < -30) diff += 60;
      syncOffsetMs = Math.round(diff * 1000);
      updateBadge();
      drawHUD();
    }

    function resetOffset() {
      syncOffsetMs = 0;
      updateBadge();
      drawHUD();
    }

    // --- 縦長スリム小窓 (200x267) HUD描画エンジン ---
    function drawHUD() {
      if (!ctx) return;
      const now = getNow();
      uiLiveClock.textContent = formatFullTime(now);

      if (!isPipActive) return;

      const w = canvas.width;
      const h = canvas.height;
      const ms = now.getUTCMilliseconds();
      const isBeat = ms < 200; // 秒の変わり目200ms間、枠線とランプが点滅発光！

      // 1. 背景描画
      ctx.fillStyle = isBeat ? '#0f233a' : '#080c14';
      ctx.fillRect(0, 0, w, h);

      // 2. 外枠 (秒切り替えビート点滅)
      ctx.strokeStyle = isBeat ? '#ffb700' : '#00f0ff';
      ctx.lineWidth = isBeat ? 8 : 4;
      ctx.strokeRect(3, 3, w - 6, h - 6);

      // 3. 上段タイトル ＆ ビートランプ
      ctx.fillStyle = '#94a3b8';
      ctx.font = 'bold 16px sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText('⏱️ WOS', 14, 28);

      // ビートインジケーターランプ
      ctx.beginPath();
      ctx.arc(w - 20, 22, 7, 0, Math.PI * 2);
      ctx.fillStyle = isBeat ? '#ffb700' : '#1e293b';
      ctx.fill();

      // 4. 時 (HH) の控えめ表示
      const hStr = 'UTC ' + String(now.getUTCHours()).padStart(2, '0') + '時';
      ctx.fillStyle = '#64748b';
      ctx.font = 'bold 16px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(hStr, w / 2, 60);

      // 5. 【主役】特大デカ文字「MM:SS.s」 (中央)
      const mmssText = formatMinutesSeconds(now);
      ctx.fillStyle = isBeat ? '#fef08a' : '#00f0ff';
      ctx.font = '900 40px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(mmssText, w / 2, 135);

      // 6. 秒針アニメーションバー (1秒周期で伸びるプログレスバー)
      const progress = ms / 1000;
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(16, 160, w - 32, 6);
      ctx.fillStyle = isBeat ? '#ffb700' : '#00ff88';
      ctx.fillRect(16, 160, (w - 32) * progress, 6);

      // 7. 下段：現在の補正値ステータス
      const secVal = (syncOffsetMs / 1000).toFixed(1);
      const signStr = syncOffsetMs > 0 ? '+' : '';
      ctx.fillStyle = syncOffsetMs === 0 ? '#64748b' : '#00ff88';
      ctx.font = 'bold 17px monospace';
      ctx.fillText(`補正: ${signStr}${secVal}s`, w / 2, 210);

      ctx.fillStyle = '#475569';
      ctx.font = '13px sans-serif';
      ctx.fillText('ホワサバと見比べ用', w / 2, 242);

      if (pipTrack && typeof pipTrack.requestFrame === 'function') {
        try { pipTrack.requestFrame(); } catch (e) {}
      }
    }

    setInterval(drawHUD, 100);

    function initPip() {
      if (!pipStream) {
        pipStream = canvas.captureStream(0);
        const tracks = pipStream.getVideoTracks();
        if (tracks && tracks.length > 0) pipTrack = tracks[0];
        video.srcObject = pipStream;
      }
      drawHUD();
    }

    btnPip.addEventListener('click', async () => {
      initPip();
      if (video.webkitPresentationMode === 'picture-in-picture') {
        video.webkitSetPresentationMode('inline');
        return;
      }
      try {
        await video.play();
        if (video.webkitSetPresentationMode) {
          video.webkitSetPresentationMode('picture-in-picture');
        } else if (video.requestPictureInPicture) {
          await video.requestPictureInPicture();
        }
      } catch (err) {
        alert('PiP起動エラー: ' + err.message);
      }
    });

    video.addEventListener('webkitpresentationmodechanged', () => {
      isPipActive = (video.webkitPresentationMode === 'picture-in-picture');
      btnPip.textContent = isPipActive ? '📺 小窓を閉じる' : '📺 縦長スリム小窓 (PiP) を開く';
    });

    // おまけ: 小窓 [⏸] を押した瞬間の自動同期も裏で残しておく (上級者向け)
    video.addEventListener('pause', async () => {
      const rawNow = new Date();
      const currentSecWithMs = rawNow.getUTCSeconds() + (rawNow.getUTCMilliseconds() / 1000);
      let diffSec = currentSecWithMs;
      if (diffSec > 30) diffSec -= 60;
      syncOffsetMs = -Math.round(diffSec * 1000);
      updateBadge();
      drawHUD();
      try { await video.play(); } catch (e) {}
    });

    document.addEventListener('DOMContentLoaded', initPip);
  </script>
</body>
</html>
