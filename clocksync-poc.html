<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>WOS ClockSync PoC (iPhone実機検証)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; }
    body {
      background: #080c14;
      color: #e6f1ff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: #0f172a;
      border: 1px solid #00f0ff;
      border-radius: 16px;
      padding: 16px;
      width: 100%;
      max-width: 440px;
      margin-bottom: 16px;
      box-shadow: 0 4px 20px rgba(0, 240, 255, 0.15);
    }
    .btn-main {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      font-size: 1rem;
      font-weight: 900;
      cursor: pointer;
      background: linear-gradient(135deg, #00f0ff 0%, #0072ff 100%);
      color: #000;
      box-shadow: 0 4px 15px rgba(0, 240, 255, 0.4);
      margin-bottom: 10px;
    }
    .btn-control {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #facc15;
      background: rgba(250, 204, 21, 0.15);
      color: #facc15;
      font-weight: bold;
      font-size: 0.9rem;
      cursor: pointer;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-control:active {
      background: rgba(250, 204, 21, 0.35);
      transform: scale(0.98);
    }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(0,0,0,0.5);
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 12px;
      font-size: 0.82rem;
    }
    .switch-label { display: flex; align-items: center; gap: 8px; font-weight: bold; cursor: pointer; }
    input[type="checkbox"] { width: 18px; height: 18px; accent-color: #00f0ff; }
    .stats-card {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 12px;
      font-family: monospace;
      font-size: 0.8rem;
      line-height: 1.6;
    }
    .stats-val { color: #00ff88; font-weight: bold; }
    .log-box {
      background: #000;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px;
      height: 200px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 0.75rem;
      color: #38bdf8;
      line-height: 1.5;
    }
    .live-clock-disp {
      font-family: monospace;
      font-size: 2.2rem;
      font-weight: 900;
      color: #00f0ff;
      text-align: center;
      background: #000;
      padding: 8px;
      border-radius: 10px;
      border: 1px solid #00f0ff;
      margin-bottom: 12px;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2 style="color: #ffb700; font-size: 1.1rem; margin-bottom: 8px; text-align: center;">
      ⏱️ WOS 時計同期 PoC (実機検証)
    </h2>
    <div id="ui-live-clock" class="live-clock-disp">00:00:00.0</div>

    <!-- 1. PiP 起動ボタン -->
    <button id="btn-pip-toggle" class="btn-main">📺 小窓 (PiP) を起動する</button>

    <!-- 2. Claude提案: 対照実験用・通常HTMLボタン (OSメディア遅延との比較用) -->
    <button id="btn-manual-sync" class="btn-control" onclick="handleManualHtmlButtonClick()">
      🎯 【対照実験】画面直接タップで :00s 同期測定
    </button>

    <!-- 3. チャッピー/Gemini提案: PoC-A (記録のみ) vs PoC-B (自動再開) 分離スイッチ (既定値: OFF) -->
    <div class="toggle-row">
      <label class="switch-label" for="chk-auto-play">
        <span>⚡ PoC-B: ⏸検知時に即座に自動play()再開を試みる</span>
      </label>
      <input type="checkbox" id="chk-auto-play">
    </div>

    <!-- 4. チャッピー提案: 統計サマリー表示カード -->
    <div class="stats-card">
      <div style="color: #94a3b8; font-weight: bold; margin-bottom: 4px;">📊 統計サマリー (チャッピー監査指標)</div>
      <div>小窓[⏸]検知: <span id="stat-pip-count" class="stats-val">0</span> 回 | 通常タップ: <span id="stat-btn-count" class="stats-val">0</span> 回</div>
      <div>小窓[⏸]平均誤差: <span id="stat-pip-avg" class="stats-val">--</span> | ブレ幅(最大-最小): <span id="stat-pip-range" class="stats-val">--</span></div>
      <div>通常タップ平均: <span id="stat-btn-avg" class="stats-val">--</span> | OS経由の純遅延差分: <span id="stat-os-lag" class="stats-val" style="color:#facc15;">--</span></div>
    </div>

    <div style="font-size: 0.75rem; color: #94a3b8; margin-bottom: 8px; display: flex; justify-content: space-between;">
      <span>📝 同期タップ履歴 (最新が上):</span>
      <button onclick="clearLog()" style="background: none; border: none; color: #ff3b5c; font-size: 0.75rem; cursor: pointer;">ログ消去</button>
    </div>
    <div id="log-monitor" class="log-box">待機中... 小窓の [⏸] または対照ボタンをタップして測定してください。</div>
  </div>

  <!-- 非表示 Canvas & Video (v1.06.77完全準拠パイプライン) -->
  <canvas id="pip-canvas" width="480" height="240" style="display: none;"></canvas>
  <video id="pip-video" playsinline muted autoplay style="position: fixed; bottom: 0; right: 0; width: 2px; height: 2px; opacity: 0.05; pointer-events: none; z-index: -1;"></video>

  <script>
    const canvas = document.getElementById('pip-canvas');
    const ctx = canvas.getContext('2d');
    const video = document.getElementById('pip-video');
    const btnPip = document.getElementById('btn-pip-toggle');
    const chkAutoPlay = document.getElementById('chk-auto-play');
    const logMonitor = document.getElementById('log-monitor');
    const uiLiveClock = document.getElementById('ui-live-clock');

    // 統計要素
    const statPipCount = document.getElementById('stat-pip-count');
    const statBtnCount = document.getElementById('stat-btn-count');
    const statPipAvg = document.getElementById('stat-pip-avg');
    const statPipRange = document.getElementById('stat-pip-range');
    const statBtnAvg = document.getElementById('stat-btn-avg');
    const statOsLag = document.getElementById('stat-os-lag');

    let pipStream = null;
    let pipTrack = null;
    let isPipActive = false;
    let syncOffsetMs = 0;
    let lastSyncInfo = { diffSec: 0, text: '未同期', timeStr: '--:--:--' };
    let isProcessingPause = false;

    // 履歴配列 (統計用)
    const pipDiffs = [];
    const btnDiffs = [];

    function getNow() {
      return new Date(Date.now() + syncOffsetMs);
    }

    function formatTime(d) {
      const h = String(d.getUTCHours()).padStart(2, '0');
      const m = String(d.getUTCMinutes()).padStart(2, '0');
      const s = String(d.getUTCSeconds()).padStart(2, '0');
      const f = Math.floor(d.getUTCMilliseconds() / 100);
      return `${h}:${m}:${s}.${f}`;
    }

    function addLog(msg) {
      const time = new Date().toLocaleTimeString('ja-JP');
      if (logMonitor.textContent.includes('待機中...')) {
        logMonitor.innerHTML = '';
      }
      logMonitor.innerHTML = `[${time}] ${msg}<br>` + logMonitor.innerHTML;
    }

    function updateStats() {
      statPipCount.textContent = pipDiffs.length;
      statBtnCount.textContent = btnDiffs.length;

      let pipAvgVal = 0;
      if (pipDiffs.length > 0) {
        const sum = pipDiffs.reduce((a, b) => a + b, 0);
        pipAvgVal = sum / pipDiffs.length;
        const min = Math.min(...pipDiffs);
        const max = Math.max(...pipDiffs);
        const range = max - min;
        statPipAvg.textContent = (pipAvgVal >= 0 ? '+' : '') + (pipAvgVal * 1000).toFixed(0) + 'ms';
        statPipRange.textContent = (range * 1000).toFixed(0) + 'ms';
      } else {
        statPipAvg.textContent = '--';
        statPipRange.textContent = '--';
      }

      let btnAvgVal = 0;
      if (btnDiffs.length > 0) {
        const sum = btnDiffs.reduce((a, b) => a + b, 0);
        btnAvgVal = sum / btnDiffs.length;
        statBtnAvg.textContent = (btnAvgVal >= 0 ? '+' : '') + (btnAvgVal * 1000).toFixed(0) + 'ms';
      } else {
        statBtnAvg.textContent = '--';
      }

      // Claude提案: 引き算によるOS層の純粋遅延算出
      if (pipDiffs.length > 0 && btnDiffs.length > 0) {
        const diff = (pipAvgVal - btnAvgVal) * 1000;
        statOsLag.textContent = (diff >= 0 ? '+' : '') + diff.toFixed(0) + 'ms';
      } else {
        statOsLag.textContent = '--';
      }
    }

    function clearLog() {
      logMonitor.innerHTML = '待機中... 小窓の [⏸] または対照ボタンをタップして測定してください。';
      pipDiffs.length = 0;
      btnDiffs.length = 0;
      updateStats();
    }

    // --- PiP HUD描画エンジン (手動requestFrame) ---
    function drawHUD() {
      if (!ctx) return;
      const now = getNow();
      const timeStr = formatTime(now);
      uiLiveClock.textContent = timeStr;

      if (!isPipActive) return;

      const w = canvas.width;
      const h = canvas.height;
      const ms = now.getUTCMilliseconds();
      const isBeat = ms < 180; // 秒の変わり目180msの間、枠線とランプが点滅

      // 1. 背景描画
      ctx.fillStyle = isBeat ? '#0f233a' : '#080c14';
      ctx.fillRect(0, 0, w, h);

      // 2. ネオン外枠 (ビート点滅)
      ctx.strokeStyle = isBeat ? '#ffb700' : '#00f0ff';
      ctx.lineWidth = isBeat ? 8 : 4;
      ctx.strokeRect(3, 3, w - 6, h - 6);

      // 3. 上段タイトル ＆ ビートランプ
      ctx.fillStyle = '#94a3b8';
      ctx.font = 'bold 20px sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText('⏱️ WOS 時計同期モード', 20, 36);

      // ビートインジケーターランプ
      ctx.beginPath();
      ctx.arc(w - 30, 28, 8, 0, Math.PI * 2);
      ctx.fillStyle = isBeat ? '#ffb700' : '#1e293b';
      ctx.fill();

      // 4. 特大デジタルUTC時計 (中央)
      ctx.fillStyle = '#00f0ff';
      ctx.font = '900 78px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(timeStr, w / 2, 130);

      // 5. 下段：最新同期ステータス
      ctx.font = 'bold 22px monospace';
      if (lastSyncInfo.text === '未同期') {
        ctx.fillStyle = '#64748b';
        ctx.fillText('ホワサバ:00秒で [⏸] をタップ', w / 2, 185);
      } else {
        ctx.fillStyle = '#00ff88';
        ctx.fillText(`最新補正: ${lastSyncInfo.text} (${lastSyncInfo.timeStr})`, w / 2, 185);
      }

      ctx.fillStyle = '#475569';
      ctx.font = '16px sans-serif';
      ctx.fillText(`小窓検知: ${pipDiffs.length}回 | 対照ボタン: ${btnDiffs.length}回`, w / 2, 220);

      if (pipTrack && typeof pipTrack.requestFrame === 'function') {
        try { pipTrack.requestFrame(); } catch (e) {}
      }
    }

    // 毎秒10回 (100ms周期) の安定描画ループ
    setInterval(drawHUD, 100);

    // --- PiP 初期化とストリーム接続 ---
    function initPip() {
      if (!pipStream) {
        pipStream = canvas.captureStream(0);
        const tracks = pipStream.getVideoTracks();
        if (tracks && tracks.length > 0) pipTrack = tracks[0];
        video.srcObject = pipStream;
      }
      drawHUD();
    }

    btnPip.addEventListener('click', async () => {
      initPip();
      if (video.webkitPresentationMode === 'picture-in-picture') {
        video.webkitSetPresentationMode('inline');
        return;
      }
      try {
        await video.play();
        if (video.webkitSetPresentationMode) {
          video.webkitSetPresentationMode('picture-in-picture');
        } else if (video.requestPictureInPicture) {
          await video.requestPictureInPicture();
        }
      } catch (err) {
        alert('PiP起動エラー: ' + err.message);
      }
    });

    video.addEventListener('webkitpresentationmodechanged', () => {
      isPipActive = (video.webkitPresentationMode === 'picture-in-picture');
      btnPip.textContent = isPipActive ? '📺 小窓を閉じる' : '📺 小窓 (PiP) を起動する';
      if (isPipActive) addLog('🚀 PiP小窓を起動しました');
      else addLog('⏹️ PiP小窓が閉じられました');
    });

    // --- 核心ロジック①：小窓 [⏸] タップ検知と同期計算 (PoC-A / PoC-B) ---
    video.addEventListener('pause', async () => {
      if (isProcessingPause) return;
      isProcessingPause = true;

      // 1. タップされた瞬間の現在時刻（補正適用前）をキャプチャ
      const rawNow = new Date();
      const currentSecWithMs = rawNow.getUTCSeconds() + (rawNow.getUTCMilliseconds() / 1000);
      
      // 2. 直近の最も近い「:00秒」とのズレを算出 (-30秒〜+30秒)
      let diffSec = currentSecWithMs;
      if (diffSec > 30) diffSec -= 60; // 例: 59.8秒なら -0.2秒（遅れ）、0.3秒なら +0.3秒（進み）

      // 3. 統計配列に記録
      pipDiffs.push(diffSec);

      // 4. オフセット補正値を更新 (ミリ秒)
      const appliedOffset = -Math.round(diffSec * 1000);
      syncOffsetMs = appliedOffset;

      const diffStr = (diffSec >= 0 ? '+' : '') + diffSec.toFixed(3) + 's';
      lastSyncInfo = {
        diffSec: diffSec,
        text: (diffSec >= 0 ? '+' : '') + diffSec.toFixed(2) + 's',
        timeStr: formatTime(getNow())
      };

      addLog(`📺 <b>[小窓⏸検知 #${pipDiffs.length}]</b> 誤差: <span style="color:#00ff88;">${diffStr}</span> (補正値: ${syncOffsetMs}ms)`);
      updateStats();
      drawHUD();

      // 5. PoC-B (自動play再開) の分岐処理
      if (chkAutoPlay.checked) {
        addLog('⚡ [PoC-B] 即時 video.play() を試行中...');
        try {
          await video.play();
          addLog('🟢 [PoC-B 成功] バックグラウンドでの自動play()再開に成功！');
        } catch (playErr) {
          addLog(`🔴 [PoC-B 拒絶] iOSにより自動再開がブロックされました: ${playErr.message}`);
        }
      } else {
        addLog('⏸️ [PoC-A] 測定完了（play自動呼び出しなし・手動再開待ち）');
      }

      isProcessingPause = false;
    });

    // --- 核心ロジック②：Claude提案 対照実験用・通常HTMLボタン タップ処理 ---
    function handleManualHtmlButtonClick() {
      const rawNow = new Date();
      const currentSecWithMs = rawNow.getUTCSeconds() + (rawNow.getUTCMilliseconds() / 1000);
      let diffSec = currentSecWithMs;
      if (diffSec > 30) diffSec -= 60;

      btnDiffs.push(diffSec);
      const diffStr = (diffSec >= 0 ? '+' : '') + diffSec.toFixed(3) + 's';

      addLog(`🟡 <b>[対照ボタン #${btnDiffs.length}]</b> 画面直接タップ誤差: <span style="color:#facc15;">${diffStr}</span>`);
      updateStats();
    }

    document.addEventListener('DOMContentLoaded', initPip);
  </script>
</body>
</html>
